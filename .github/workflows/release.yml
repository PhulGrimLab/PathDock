name: Release

# v 로 시작하는 태그(예: v1.0.1)를 푸시하면 빌드해서 GitHub Release를 만들고 exe를 첨부한다.
# 수동 실행(Run workflow)은 릴리스를 만들지 않고 빌드·테스트만 확인해 결과물을 아티팩트로 남긴다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 액션은 태그가 아닌 커밋 SHA로 고정한다(태그는 옮길 수 있어, 공급망 공격으로 릴리스 빌드에 코드가 끼어들 수 있다). 올릴 때는 새 SHA를 확인하고 주석의 버전도 함께 고친다.
permissions:
  contents: write # 릴리스 생성에 필요

jobs:
  release:
    runs-on: windows-latest
    env:
      # 코드 서명(SignPath Foundation, 선택). 저장소 변수 SIGNPATH_ORGANIZATION_ID 가 있으면 서명하고, 없으면 서명 없이 릴리스한다.
      # 설정 방법: SignPath 가입·승인 후 저장소 Settings > Secrets and variables > Actions 에
      #   변수 SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG 와 시크릿 SIGNPATH_API_TOKEN 을 추가한다.
      SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # 태그 이름은 이후 단계의 명령줄에 들어가므로 형식을 엄격히 검증한다(스크립트 주입 방지: 예 v1.0;calc).
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
              Write-Host '::error::tag must look like v1.2.3 or v1.2.3-beta.1'
              exit 1
            }
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = '0.0.0-manual'
          }
          # 파일/어셈블리 버전은 숫자만 허용하므로 "1.2.3-beta1"에서 앞의 숫자 부분만 쓴다.
          $numeric = ($version -split '-')[0]
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version numeric=$numeric"

      - name: Test
        run: dotnet test src/PathDock.Tests -c Release

      # Release 빌드는 끝나면 자동으로 단일 파일 publish까지 실행해 publish\Release\PathDock.App.exe 를 만든다.
      - name: Build (single-file exe)
        env:
          NUMERIC_VERSION: ${{ steps.ver.outputs.numeric }}
        run: dotnet build src/PathDock.App -c Release -p:Version=$env:NUMERIC_VERSION

      # 서명 전 exe를 아티팩트로 올리면 SignPath가 이를 받아 서명한다(서명은 SignPath 쪽에서 승인 정책에 따라 진행).
      - name: Upload unsigned exe
        id: unsigned
        if: ${{ env.SIGNPATH_ORG != '' && github.ref_type == 'tag' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-exe
          path: publish/Release/PathDock.App.exe

      - name: Sign with SignPath
        if: ${{ env.SIGNPATH_ORG != '' && github.ref_type == 'tag' }}
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Package
        id: pkg
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $name = "PathDock-v$($env:VERSION)-win-x64"
          New-Item -ItemType Directory -Force dist | Out-Null
          # 서명된 exe가 있으면 그것을, 없으면 서명하지 않은 exe를 쓴다.
          $exe = if (Test-Path signed\PathDock.App.exe) { 'signed\PathDock.App.exe' } else { 'publish\Release\PathDock.App.exe' }
          Write-Host "packaging: $exe"
          Copy-Item $exe "dist\$name.exe"
          Compress-Archive -Path "dist\$name.exe" -DestinationPath "dist\$name.zip"
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii dist\SHA256SUMS.txt
          }
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PathDock-win-x64
          path: dist/*

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $flags = @()
          if ($env:VERSION -match '-') { $flags += '--prerelease' }
          $assets = Get-ChildItem dist | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @assets --title "PathDock $env:GITHUB_REF_NAME" --generate-notes --verify-tag @flags
